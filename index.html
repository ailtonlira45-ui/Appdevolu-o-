<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Painel Multiplex</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000000;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }

        .painel-fullscreen {
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            background: #000000;
            display: flex;
            flex-direction: column;
            padding: 12px 16px;
            position: relative;
            overflow-y: auto;
            overflow-x: hidden;
        }

        .grid-botoes {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 14px;
            flex: 1;
            align-content: center;
            padding: 8px 0;
            min-height: 0;
        }

        .botao-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            width: 100%;
        }

        .botao-3d {
            width: 100%;
            aspect-ratio: 1 / 0.95;
            border-radius: 12px;
            border: none;
            cursor: pointer;
            position: relative;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            outline: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: clamp(0.6em, 1.5vw, 0.75em);
            font-weight: 700;
            color: #d4d4d4;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.95);
            padding: 10px 6px;
            min-width: 0;
            word-break: break-word;
            text-align: center;

            background: linear-gradient(135deg,
                    rgba(200, 220, 255, 0.08) 0%,
                    rgba(150, 180, 220, 0.04) 25%,
                    rgba(100, 130, 180, 0.02) 50%,
                    rgba(150, 180, 220, 0.04) 75%,
                    rgba(200, 220, 255, 0.08) 100%);

            border: 2px solid rgba(58, 107, 206, 0.6);
            border-bottom: 3px solid rgba(30, 61, 122, 0.8);
            border-top: 2px solid rgba(120, 170, 240, 0.5);

            box-shadow:
                0 10px 0 rgba(0, 0, 0, 0.9),
                0 14px 28px rgba(0, 0, 0, 0.95),
                0 0 15px rgba(80, 140, 220, 0.2),
                0 0 4px rgba(120, 180, 255, 0.3),
                inset 0 1px 2px rgba(255, 255, 255, 0.25),
                inset 0 -2px 4px rgba(0, 0, 0, 0.8),
                inset 0 -3px 8px rgba(60, 120, 200, 0.3);

            overflow: hidden;
            will-change: transform;
        }

        /* Reflexo de vidro - brilho superior */
        .botao-3d::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 50%;
            background: linear-gradient(180deg,
                    rgba(255, 255, 255, 0.3) 0%,
                    rgba(255, 255, 255, 0.15) 30%,
                    rgba(200, 220, 255, 0.05) 60%,
                    transparent 100%);
            border-radius: 10px 10px 0 0;
            pointer-events: none;
            transition: all 0.2s ease;
            z-index: 1;
        }

        /* Reflexo de vidro - brilho diagonal */
        .botao-3d::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 60%;
            height: 200%;
            background: linear-gradient(90deg,
                    transparent 0%,
                    rgba(255, 255, 255, 0.08) 40%,
                    rgba(255, 255, 255, 0.15) 50%,
                    rgba(255, 255, 255, 0.08) 60%,
                    transparent 100%);
            transform: rotate(25deg);
            pointer-events: none;
            transition: left 0.6s ease;
            z-index: 1;
        }

        .botao-3d:hover::after {
            left: 100%;
        }

        .botao-3d:active {
            transform: translateY(5px);
            box-shadow:
                0 5px 0 rgba(0, 0, 0, 0.9),
                0 8px 18px rgba(0, 0, 0, 0.95),
                0 0 10px rgba(80, 140, 220, 0.15),
                inset 0 1px 2px rgba(255, 255, 255, 0.2),
                inset 0 -3px 6px rgba(0, 0, 0, 0.85),
                inset 0 -2px 4px rgba(60, 120, 200, 0.25);
            transition: all 0.08s ease;
        }

        .botao-3d:active::before {
            opacity: 0.7;
            height: 45%;
        }

        /* Estado SELECIONADO - vidro com brilho azul intenso */
        .botao-3d.selecionado {
            background: linear-gradient(135deg,
                    rgba(180, 220, 255, 0.15) 0%,
                    rgba(140, 180, 230, 0.08) 25%,
                    rgba(100, 150, 210, 0.05) 50%,
                    rgba(140, 180, 230, 0.08) 75%,
                    rgba(180, 220, 255, 0.15) 100%);

            transform: translateY(4px);
            border-color: rgba(91, 184, 232, 0.8);
            border-bottom-color: rgba(46, 122, 165, 0.9);
            border-top-color: rgba(136, 204, 255, 0.7);
            box-shadow:
                0 6px 0 rgba(10, 26, 37, 0.9),
                0 10px 22px rgba(0, 0, 0, 0.95),
                0 0 18px rgba(91, 184, 232, 0.5),
                0 0 35px rgba(91, 184, 232, 0.3),
                0 0 10px rgba(91, 184, 232, 0.6),
                inset 0 1px 3px rgba(255, 255, 255, 0.4),
                inset 0 -2px 6px rgba(0, 0, 0, 0.85),
                inset 0 -3px 10px rgba(91, 184, 232, 0.5);
            animation: brilhoVidro 2.5s ease-in-out infinite alternate;
        }

        .botao-3d.selecionado::before {
            background: linear-gradient(180deg,
                    rgba(255, 255, 255, 0.45) 0%,
                    rgba(200, 230, 255, 0.25) 30%,
                    rgba(140, 190, 255, 0.1) 60%,
                    transparent 100%);
            height: 55%;
        }

        .botao-3d.selecionado::after {
            background: linear-gradient(90deg,
                    transparent 0%,
                    rgba(180, 220, 255, 0.15) 40%,
                    rgba(180, 220, 255, 0.25) 50%,
                    rgba(180, 220, 255, 0.15) 60%,
                    transparent 100%);
            animation: reflexoVidro 3s ease-in-out infinite;
        }

        @keyframes brilhoVidro {
            0% {
                border-color: rgba(91, 184, 232, 0.8);
                box-shadow:
                    0 6px 0 rgba(10, 26, 37, 0.9),
                    0 10px 22px rgba(0, 0, 0, 0.95),
                    0 0 15px rgba(91, 184, 232, 0.4),
                    0 0 28px rgba(91, 184, 232, 0.25),
                    0 0 8px rgba(91, 184, 232, 0.5),
                    inset 0 1px 3px rgba(255, 255, 255, 0.35),
                    inset 0 -2px 6px rgba(0, 0, 0, 0.85),
                    inset 0 -3px 10px rgba(91, 184, 232, 0.45);
            }
            100% {
                border-color: rgba(136, 204, 255, 0.9);
                box-shadow:
                    0 6px 0 rgba(10, 26, 37, 0.9),
                    0 10px 22px rgba(0, 0, 0, 0.95),
                    0 0 25px rgba(91, 184, 232, 0.65),
                    0 0 45px rgba(91, 184, 232, 0.4),
                    0 0 15px rgba(91, 184, 232, 0.75),
                    inset 0 1px 3px rgba(255, 255, 255, 0.5),
                    inset 0 -2px 6px rgba(0, 0, 0, 0.85),
                    inset 0 -3px 12px rgba(91, 184, 232, 0.6);
            }
        }

        @keyframes reflexoVidro {
            0%, 100% {
                left: -50%;
                opacity: 0.7;
            }
            50% {
                left: 100%;
                opacity: 1;
            }
        }

        /* Ícones SVG personalizados */
        .icone-svg {
            width: clamp(32px, 7vw, 42px);
            height: clamp(32px, 7vw, 42px);
            margin-bottom: 4px;
            filter: drop-shadow(0 2px 6px rgba(0, 0, 0, 0.95)) drop-shadow(0 0 4px rgba(160, 200, 255, 0.25));
            transition: all 0.2s ease;
            position: relative;
            z-index: 2;
        }

        .botao-3d:active .icone-svg {
            transform: scale(0.88);
            filter: drop-shadow(0 1px 3px rgba(0, 0, 0, 0.9)) drop-shadow(0 0 3px rgba(160, 200, 255, 0.2));
        }

        /* Ícones laranja */
        .icone-laranja {
            stroke: #ffaa55;
            fill: #ff8c42;
            filter: drop-shadow(0 2px 6px rgba(0, 0, 0, 0.95)) drop-shadow(0 0 5px rgba(255, 140, 66, 0.4));
        }

        /* Ícones verde */
        .icone-verde {
            stroke: #55dd88;
            fill: #2ecc71;
            filter: drop-shadow(0 2px 6px rgba(0, 0, 0, 0.95)) drop-shadow(0 0 5px rgba(46, 204, 113, 0.4));
        }

        .selecionado .icone-laranja {
            stroke: #ffcc88;
            fill: #ff9a4d;
            filter: drop-shadow(0 2px 6px rgba(0, 0, 0, 0.95)) drop-shadow(0 0 8px rgba(255, 140, 66, 0.6)) drop-shadow(0 0 15px rgba(255, 140, 66, 0.4));
        }

        .selecionado .icone-verde {
            stroke: #88ffaa;
            fill: #4de68a;
            filter: drop-shadow(0 2px 6px rgba(0, 0, 0, 0.95)) drop-shadow(0 0 8px rgba(46, 204, 113, 0.6)) drop-shadow(0 0 15px rgba(46, 204, 113, 0.4));
        }

        .botao-label {
            color: #666;
            font-size: clamp(0.55em, 1.3vw, 0.65em);
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            text-align: center;
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.95);
            line-height: 1.1;
            margin-top: 3px;
            position: relative;
            z-index: 2;
        }

        .selecionado .botao-label {
            color: #88ccff;
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.95), 0 0 8px rgba(91, 184, 232, 0.5);
        }

        .led-indicator {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #050505;
            box-shadow: 0 0 6px rgba(0, 0, 0, 0.95), inset 0 1px 2px rgba(255, 255, 255, 0.05);
            flex-shrink: 0;
            transition: all 0.3s ease;
        }

        .led-active {
            background: #5bb8e8;
            box-shadow: 0 0 8px #5bb8e8, 0 0 16px #5bb8e8, 0 0 28px rgba(91, 184, 232, 0.4), 0 0 40px rgba(91, 184, 232, 0.2);
            animation: ledGlow 2.5s ease-in-out infinite alternate;
        }

        @keyframes ledGlow {
            0% {
                box-shadow: 0 0 6px #5bb8e8, 0 0 14px #5bb8e8, 0 0 22px rgba(91, 184, 232, 0.3);
            }
            100% {
                box-shadow: 0 0 10px #5bb8e8, 0 0 22px #5bb8e8, 0 0 35px rgba(91, 184, 232, 0.45), 0 0 50px rgba(91, 184, 232, 0.25);
            }
        }

        .painel-footer {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 12px 0;
            border-top: 1px solid #0a0a0a;
            flex-shrink: 0;
            margin-top: 10px;
        }

        .btn-reset {
            background: linear-gradient(135deg,
                    rgba(200, 220, 255, 0.08) 0%,
                    rgba(150, 180, 220, 0.04) 25%,
                    rgba(100, 130, 180, 0.02) 50%,
                    rgba(150, 180, 220, 0.04) 75%,
                    rgba(200, 220, 255, 0.08) 100%);
            border: 2px solid rgba(58, 107, 206, 0.6);
            border-bottom: 3px solid rgba(30, 61, 122, 0.8);
            border-top: 2px solid rgba(120, 170, 240, 0.5);
            color: #666;
            padding: 10px 30px;
            border-radius: 12px;
            cursor: pointer;
            font-size: clamp(0.7em, 1.5vw, 0.8em);
            font-weight: 700;
            letter-spacing: 2px;
            transition: all 0.3s;
            text-transform: uppercase;
            box-shadow: 0 6px 0 rgba(0, 0, 0, 0.9), 0 0 12px rgba(80, 140, 220, 0.15), 0 0 4px rgba(120, 180, 255, 0.2);
            position: relative;
            overflow: hidden;
        }

        .btn-reset::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 50%;
            background: linear-gradient(180deg,
                    rgba(255, 255, 255, 0.3) 0%,
                    rgba(255, 255, 255, 0.15) 30%,
                    rgba(200, 220, 255, 0.05) 60%,
                    transparent 100%);
            border-radius: 10px 10px 0 0;
            pointer-events: none;
            transition: all 0.3s ease;
        }

        .btn-reset:hover {
            border-color: rgba(91, 184, 232, 0.8);
            box-shadow: 0 6px 0 rgba(0, 0, 0, 0.9), 0 0 20px rgba(91, 184, 232, 0.3), 0 0 6px rgba(120, 180, 255, 0.3);
            color: #88ccff;
        }

        .btn-reset:active {
            background: rgba(10, 10, 10, 0.5);
            color: #88ccff;
            transform: translateY(4px);
            box-shadow: 0 2px 0 rgba(0, 0, 0, 0.9), 0 0 18px rgba(91, 184, 232, 0.4), 0 0 5px rgba(120, 180, 255, 0.3);
            border-color: rgba(91, 184, 232, 0.8);
        }

        @media (max-width: 600px) and (orientation: landscape) {
            .grid-botoes {
                grid-template-columns: repeat(6, 1fr);
                gap: 8px;
            }
            .botao-3d {
                border-radius: 10px;
                font-size: 0.55em;
                aspect-ratio: 1 / 0.9;
            }
            .icone-svg {
                width: clamp(26px, 5.5vw, 32px);
                height: clamp(26px, 5.5vw, 32px);
            }
            .botao-label {
                font-size: 0.5em;
            }
            .painel-fullscreen {
                padding: 6px 10px;
            }
        }

        @media (min-width: 768px) and (orientation: landscape) {
            .grid-botoes {
                grid-template-columns: repeat(6, 1fr);
                gap: 18px;
                max-width: 850px;
                margin: 0 auto;
                width: 100%;
            }
            .botao-3d {
                border-radius: 14px;
            }
            .icone-svg {
                width: 46px;
                height: 46px;
            }
        }

        @media (min-width: 1024px) {
            .painel-fullscreen {
                justify-content: center;
            }
            .grid-botoes {
                max-width: 950px;
                gap: 22px;
            }
        }

        @media (orientation: portrait) {
            .grid-botoes {
                grid-template-columns: repeat(3, 1fr);
                gap: 16px;
            }
            .botao-3d {
                aspect-ratio: 1 / 1.05;
                font-size: 0.7em;
                border-radius: 12px;
            }
            .icone-svg {
                width: 38px;
                height: 38px;
            }
            .botao-label {
                font-size: 0.6em;
            }
        }
    </style>
</head>
<body>
    <div class="painel-fullscreen">
        <div class="grid-botoes" id="gridBotoes">
            <!-- USB -->
            <div class="botao-wrapper">
                <button class="botao-3d" data-nome="USB" onclick="toggleBotao(this)">
                    <svg class="icone-svg icone-laranja" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 2L12 12"/>
                        <path d="M8 6L12 2L16 6"/>
                        <rect x="7" y="12" width="10" height="8" rx="2"/>
                        <path d="M10 16L14 16"/>
                    </svg>
                    <span class="botao-label">USB</span>
                </button>
                <div class="led-indicator" id="led-USB"></div>
            </div>

            <!-- WiFi -->
            <div class="botao-wrapper">
                <button class="botao-3d" data-nome="WiFi" onclick="toggleBotao(this)">
                    <svg class="icone-svg icone-verde" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M5 12.55a11 11 0 0 1 14.08 0"/>
                        <path d="M1.42 9a16 16 0 0 1 21.16 0"/>
                        <path d="M8.53 16.11a6 6 0 0 1 6.95 0"/>
                        <circle cx="12" cy="20" r="1"/>
                    </svg>
                    <span class="botao-label">WiFi</span>
                </button>
                <div class="led-indicator" id="led-WiFi"></div>
            </div>

            <!-- Leitura -->
            <div class="botao-wrapper">
                <button class="botao-3d" data-nome="Leitura" onclick="toggleBotao(this)">
                    <svg class="icone-svg icone-laranja" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/>
                        <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>
                        <line x1="12" y1="8" x2="12" y2="12"/>
                    </svg>
                    <span class="botao-label">Leitura</span>
                </button>
                <div class="led-indicator" id="led-Leitura"></div>
            </div>

            <!-- Poltronas -->
            <div class="botao-wrapper">
                <button class="botao-3d" data-nome="Poltronas" onclick="toggleBotao(this)">
                    <svg class="icone-svg icone-verde" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="4" y="6" width="16" height="12" rx="2"/>
                        <path d="M7 6V4a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v2"/>
                        <path d="M7 18v2a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2v-2"/>
                        <line x1="8" y1="10" x2="16" y2="10"/>
                    </svg>
                    <span class="botao-label">Poltronas</span>
                </button>
                <div class="led-indicator" id="led-Poltronas"></div>
            </div>

            <!-- Corredor -->
            <div class="botao-wrapper">
                <button class="botao-3d" data-nome="Corredor" onclick="toggleBotao(this)">
                    <svg class="icone-svg icone-laranja" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="3" y1="12" x2="21" y2="12"/>
                        <line x1="3" y1="6" x2="21" y2="6"/>
                        <line x1="3" y1="18" x2="21" y2="18"/>
                        <polygon points="15 12 21 8 21 16 15 12"/>
                    </svg>
                    <span class="botao-label">Corredor</span>
                </button>
                <div class="led-indicator" id="led-Corredor"></div>
            </div>

            <!-- Salão -->
            <div class="botao-wrapper">
                <button class="botao-3d" data-nome="Salão" onclick="toggleBotao(this)">
                    <svg class="icone-svg icone-verde" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="2" y="3" width="20" height="18" rx="2"/>
                        <line x1="2" y1="9" x2="22" y2="9"/>
                        <circle cx="12" cy="15" r="2"/>
                        <path d="M8 15L8 15.01"/>
                        <path d="M16 15L16 15.01"/>
                    </svg>
                    <span class="botao-label">Salão</span>
                </button>
                <div class="led-indicator" id="led-Salão"></div>
            </div>

            <!-- Luz Noturna -->
            <div class="botao-wrapper">
                <button class="botao-3d" data-nome="Luz Noturna" onclick="toggleBotao(this)">
                    <svg class="icone-svg icone-laranja" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
                        <circle cx="12" cy="12" r="3"/>
                        <line x1="12" y1="2" x2="12" y2="5"/>
                        <line x1="12" y1="19" x2="12" y2="22"/>
                        <line x1="4.93" y1="4.93" x2="7.05" y2="7.05"/>
                        <line x1="16.95" y1="16.95" x2="19.07" y2="19.07"/>
                    </svg>
                    <span class="botao-label">Luz Not.</span>
                </button>
                <div class="led-indicator" id="led-Luz Noturna"></div>
            </div>

            <!-- Banheiro -->
            <div class="botao-wrapper">
                <button class="botao-3d" data-nome="Banheiro" onclick="toggleBotao(this)">
                    <svg class="icone-svg icone-verde" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="5" r="2"/>
                        <path d="M10 22v-5l-2-7h8l-2 7v5"/>
                        <path d="M8 10h8"/>
                        <rect x="4" y="12" width="16" height="8" rx="1"/>
                    </svg>
                    <span class="botao-label">Banheiro</span>
                </button>
                <div class="led-indicator" id="led-Banheiro"></div>
            </div>

            <!-- Ventilação 1 -->
            <div class="botao-wrapper">
                <button class="botao-3d" data-nome="Ventilação 1" onclick="toggleBotao(this)">
                    <svg class="icone-svg icone-laranja" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="10"/>
                        <path d="M12 2a10 10 0 0 1 10 10"/>
                        <path d="M12 2a10 10 0 0 0-10 10"/>
                        <line x1="2" y1="12" x2="22" y2="12"/>
                        <path d="M12 2a15 15 0 0 1 4 10 15 15 0 0 1-4 10"/>
                        <path d="M12 2a15 15 0 0 0-4 10 15 15 0 0 0 4 10"/>
                    </svg>
                    <span class="botao-label">Vent. 1</span>
                </button>
                <div class="led-indicator" id="led-Ventilação 1"></div>
            </div>

            <!-- Ventilação 2 -->
            <div class="botao-wrapper">
                <button class="botao-3d" data-nome="Ventilação 2" onclick="toggleBotao(this)">
                    <svg class="icone-svg icone-verde" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="10"/>
                        <path d="M12 2a10 10 0 0 1 10 10"/>
                        <path d="M12 2a10 10 0 0 0-10 10"/>
                        <line x1="2" y1="12" x2="22" y2="12"/>
                        <path d="M12 2a15 15 0 0 1 4 10 15 15 0 0 1-4 10"/>
                        <path d="M12 2a15 15 0 0 0-4 10 15 15 0 0 0 4 10"/>
                    </svg>
                    <span class="botao-label">Vent. 2</span>
                </button>
                <div class="led-indicator" id="led-Ventilação 2"></div>
            </div>

            <!-- Geladeira -->
            <div class="botao-wrapper">
                <button class="botao-3d" data-nome="Geladeira" onclick="toggleBotao(this)">
                    <svg class="icone-svg icone-laranja" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="4" y="2" width="16" height="20" rx="2"/>
                        <line x1="4" y1="10" x2="20" y2="10"/>
                        <rect x="8" y="4" width="8" height="4" rx="1"/>
                        <line x1="8" y1="14" x2="16" y2="14"/>
                    </svg>
                    <span class="botao-label">Geladeira</span>
                </button>
                <div class="led-indicator" id="led-Geladeira"></div>
            </div>
        </div>

        <div class="painel-footer">
            <button class="btn-reset" onclick="resetTodos()">RESET</button>
        </div>
    </div>

    <script>
        const estadoBotoes = {};

        function toggleBotao(botao) {
            const nome = botao.getAttribute('data-nome');
            const led = document.getElementById('led-' + nome);

            if (!estadoBotoes[nome]) {
                estadoBotoes[nome] = true;
                botao.classList.add('selecionado');
                if (led) {
                    led.classList.add('led-active');
                }

                if (window.navigator && window.navigator.vibrate) {
                    window.navigator.vibrate(20);
                }

                console.log(`✅ Botão ${nome}: LIGADO`);
            } else {
                estadoBotoes[nome] = false;
                botao.classList.remove('selecionado');
                if (led) {
                    led.classList.remove('led-active');
                }

                if (window.navigator && window.navigator.vibrate) {
                    window.navigator.vibrate(15);
                }

                console.log(`❌ Botão ${nome}: DESLIGADO`);
            }
        }

        function resetTodos() {
            const botoes = document.querySelectorAll('.botao-3d');
            botoes.forEach(botao => {
                const nome = botao.getAttribute('data-nome');
                estadoBotoes[nome] = false;
                botao.classList.remove('selecionado');
                const led = document.getElementById('led-' + nome);
                if (led) {
                    led.classList.remove('led-active');
                }
            });

            if (window.navigator && window.navigator.vibrate) {
                window.navigator.vibrate(40);
            }
            console.log('🔄 Todos os botões resetados');
        }

        document.addEventListener('DOMContentLoaded', () => {
            const botoes = document.querySelectorAll('.botao-3d');
            botoes.forEach(botao => {
                const nome = botao.getAttribute('data-nome');
                estadoBotoes[nome] = false;
            });

            document.addEventListener('gesturestart', function(e) {
                e.preventDefault();
            });
            document.addEventListener('gesturechange', function(e) {
                e.preventDefault();
            });
            document.addEventListener('gestureend', function(e) {
                e.preventDefault();
            });

            document.querySelectorAll('.botao-3d').forEach(botao => {
                botao.addEventListener('touchstart', function(e) {
                    e.stopPropagation();
                }, { passive: false });
                botao.addEventListener('touchmove', function(e) {
                    e.preventDefault();
                }, { passive: false });
            });
        });
    </script>
</body>
</html>

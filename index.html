<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Painel Multiplex - Live Stream</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background-color: #0b0f19;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
        }

        .multiplex-container {
            background: linear-gradient(145deg, #161b22, #0d1117);
            border: 4px solid #30363d;
            border-radius: 16px;
            width: 96vw;
            height: 94vh;
            padding: 15px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.9), inset 0 0 20px rgba(0,255,204,0.05);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .header {
            text-align: center;
            border-bottom: 2px solid #21262d;
            padding-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            font-size: 1.1rem;
            color: #00ffcc;
            letter-spacing: 2px;
            text-transform: uppercase;
            text-shadow: 0 0 10px rgba(0,255,204,0.5);
        }

        .live-badge {
            background: #da3633;
            color: white;
            font-size: 0.75rem;
            font-weight: bold;
            padding: 3px 8px;
            border-radius: 4px;
            letter-spacing: 1px;
            box-shadow: 0 0 10px rgba(218,54,51,0.6);
        }

        .grid-painel {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            grid-template-rows: repeat(2, 1fr);
            gap: 15px;
            flex-grow: 1;
            padding: 10px 0;
        }

        .btn {
            background: linear-gradient(145deg, #21262d, #161b22);
            color: #8b949e;
            border: 3px solid #30363d;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.15s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: inset 0 4px 6px rgba(255,255,255,0.03), 0 6px 10px rgba(0,0,0,0.4);
            position: relative;
            overflow: hidden;
        }

        .btn svg {
            width: 48px;
            height: 48px;
            fill: currentColor;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
            transition: transform 0.1s ease;
        }

        .btn:active svg {
            transform: scale(0.92);
        }

        .btn-label {
            font-size: 0.7rem;
            margin-top: 6px;
            font-weight: bold;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        /* Estados Ativos com Cores Vibrantes para Destaque na Live */
        .btn.active.blue {
            background: linear-gradient(145deg, rgba(0,229,255,0.2), rgba(0,136,204,0.4));
            color: #00e5ff;
            border-color: #00e5ff;
            box-shadow: 0 0 25px rgba(0,229,255,0.6), inset 0 0 15px rgba(0,229,255,0.3);
        }

        .btn.active.green {
            background: linear-gradient(145deg, rgba(0,255,102,0.2), rgba(0,180,60,0.4));
            color: #00ff66;
            border-color: #00ff66;
            box-shadow: 0 0 25px rgba(0,255,102,0.6), inset 0 0 15px rgba(0,255,102,0.3);
        }

        .btn.active.amber {
            background: linear-gradient(145deg, rgba(255,170,0,0.2), rgba(200,120,0,0.4));
            color: #ffaa00;
            border-color: #ffaa00;
            box-shadow: 0 0 25px rgba(255,170,0,0.6), inset 0 0 15px rgba(255,170,0,0.3);
        }

        .status-bar {
            display: flex;
            justify-content: space-between;
            background: #0d1117;
            padding: 8px 15px;
            border-radius: 8px;
            font-size: 0.75rem;
            border: 1px solid #21262d;
            color: #8b949e;
        }

        .status-on {
            color: #00ff66;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="multiplex-container">
        <div class="header">
            <h1>Painel Multiplex • Cockpit</h1>
            <div class="live-badge">LIVE MODE</div>
        </div>

        <div class="grid-painel">
            <!-- 1. Luz Salão -->
            <button class="btn blue" onclick="toggleBtn(this)">
                <svg viewBox="0 0 24 24"><path d="M12,2A10,10 0 0,1 22,12A10,10 0 0,1 12,22A10,10 0 0,1 2,12A10,10 0 0,1 12,2M12,4A8,8 0 0,0 4,12A8,8 0 0,0 12,20A8,8 0 0,0 20,12A8,8 0 0,0 12,4M11,6H13V13H11V6M11,15H13V17H11V15Z"/></svg>
                <span class="btn-label">Salão</span>
            </button>

            <!-- 2. Luz Corredor -->
            <button class="btn blue" onclick="toggleBtn(this)">
                <svg viewBox="0 0 24 24"><path d="M19,3H5C3.89,3 3,3.89 3,5V19C3,20.1 3.9,21 5,21H19C20.1,21 21,20.1 21,19V5C21,3.89 20.1,3 19,3M11,5H13V19H11V5M5,5H9V19H5V5M15,5H19V19H15V5Z"/></svg>
                <span class="btn-label">Corredor</span>
            </button>

            <!-- 3. Luz Poltrona -->
            <button class="btn green" onclick="toggleBtn(this)">
                <svg viewBox="0 0 24 24"><path d="M6,2H18A2,2 0 0,1 20,4V10A2,2 0 0,1 18,12H17V14H19V20H17V22H15V20H9V22H7V20H5V14H7V12H6A2,2 0 0,1 4,10V4A2,2 0 0,1 6,2M6,4V10H18V4H6M6,14V18H18V14H6Z"/></svg>
                <span class="btn-label">Poltrona</span>
            </button>

            <!-- 4. Leitura -->
            <button class="btn green" onclick="toggleBtn(this)">
                <svg viewBox="0 0 24 24"><path d="M12,3A9,9 0 0,0 3,12H5A7,7 0 0,1 12,5V3M19,12A7,7 0 0,1 12,19V21A9,9 0 0,0 21,12H19M12,8A4,4 0 0,0 8,12H10A2,2 0 0,1 12,10V8Z"/></svg>
                <span class="btn-label">Leitura</span>
            </button>

            <!-- 5. Wi-Fi -->
            <button class="btn blue" onclick="toggleBtn(this)">
                <svg viewBox="0 0 24 24"><path d="M12,3C7.79,3 3.7,4.41 0.38,7L2.25,9.39C5.03,7.27 8.39,6 12,6C15.61,6 18.97,7.27 21.75,9.39L23.62,7C20.3,4.41 16.21,3 12,3M12,9C9.3,9 6.75,10 4.72,11.66L6.59,14.05C8.12,12.82 10,12 12,12C14,12 15.88,12.82 17.41,14.05L19.28,11.66C17.25,10 14.7,9 12,9M12,15A3,3 0 0,0 9,18A3,3 0 0,0 12,21A3,3 0 0,0 15,18A3,3 0 0,0 12,15Z"/></svg>
                <span class="btn-label">Wi-Fi</span>
            </button>

            <!-- 6. Tomada USB -->
            <button class="btn blue" onclick="toggleBtn(this)">
                <svg viewBox="0 0 24 24"><path d="M15,7V4H17V2H13V4H15V7H9V4H11V2H7V4H9V7H5V9H19V7H15M7,11V22H17V11H7M9,13H15V20H9V13Z"/></svg>
                <span class="btn-label">USB</span>
            </button>

            <!-- 7. Luz Noturna -->
            <button class="btn amber" onclick="toggleBtn(this)">
                <svg viewBox="0 0 24 24"><path d="M12,2A10,10 0 0,0 2,12A10,10 0 0,0 12,22A10,10 0 0,0 22,12A10,10 0 0,0 12,2M12,4A8,8 0 0,1 20,12A8,8 0 0,1 12,20V4Z"/></svg>
                <span class="btn-label">Noturna</span>
            </button>

            <!-- 8. Banheiro -->
            <button class="btn amber" onclick="toggleBtn(this)">
                <svg viewBox="0 0 24 24"><path d="M7,2H17A2,2 0 0,1 19,4V20A2,2 0 0,1 17,22H7A2,2 0 0,1 5,20V4A2,2 0 0,1 7,2M11,4H13V6H11V4M9,8H15V10H9V8M12,12A2,2 0 0,1 14,14V19H12V14H10V19H8V14A2,2 0 0,1 10,12H12Z"/></svg>
                <span class="btn-label">Banheiro</span>
            </button>

            <!-- 9. Ventilação Baixa -->
            <button class="btn blue" onclick="setVent('baixa', this)">
                <svg viewBox="0 0 24 24"><path d="M12,10C11,10 10,11 10,12C10,13 11,14 12,14C13,14 14,13 14,12C14,11 13,10 12,10M12,2C10.89,2 10,2.89 10,4V5.08C7.11,5.56 5,8.04 5,11C5,14.31 7.69,17 11,17V21H13V17C16.31,17 19,14.31 19,11C19,8.04 16.89,5.56 14,5.08V4C14,2.89 13.11,2 12,2Z"/></svg>
                <span class="btn-label">Vent. Baixa</span>
            </button>

            <!-- 10. Ventilação Alta -->
            <button class="btn blue" onclick="setVent('alta', this)">
                <svg viewBox="0 0 24 24"><path d="M12,8C10.34,8 9,9.34 9,11C9,12.66 10.34,14 12,14C13.66,14 15,12.66 15,11C15,9.34 13.66,8 12,8M12,2C9.79,2 8,3.79 8,6C8,6.8 8.24,7.54 8.65,8.18C6.04,9.25 4.19,11.83 4.19,14.81C4.19,18.78 7.42,22 11.39,22H13.61C17.58,22 20.81,18.78 20.81,14.81C20.81,11.83 18.96,9.25 16.35,8.18C16.76,7.54 17,6.8 17,6C17,3.79 15.21,2 13,2H12Z"/></svg>
                <span class="btn-label">Vent. Alta</span>
            </button>
        </div>

        <div class="status-bar">
            <span>STATUS: <span class="status-on">TRANSMISSÃO AO VIVO</span></span>
            <span>ORIENTAÇÃO: HORIZONTAL (PAISAGEM)</span>
        </div>
    </div>

    <script>
        function toggleBtn(btn) {
            btn.classList.toggle('active');
        }

        function setVent(nivel, btn) {
            const ventBtns = document.querySelectorAll('.grid-painel button:nth-last-child(-n+2)');
            ventBtns.forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        }
    </script>
</body>
</html>

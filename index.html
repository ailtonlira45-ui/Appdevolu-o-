<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Painel Multiplex</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000000;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }

        .painel-fullscreen {
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            background: #000000;
            display: flex;
            flex-direction: column;
            padding: 12px 16px;
            position: relative;
            overflow-y: auto;
            overflow-x: hidden;
        }

        .painel-header {
            text-align: center;
            padding: 4px 0 6px;
            flex-shrink: 0;
            opacity: 0;
            height: 0;
            overflow: hidden;
        }

        .grid-botoes {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 12px;
            flex: 1;
            align-content: center;
            padding: 8px 0;
            min-height: 0;
        }

        .botao-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            width: 100%;
        }

        .botao-3d {
            width: 100%;
            aspect-ratio: 1 / 0.95;
            border-radius: 16px;
            border: none;
            cursor: pointer;
            position: relative;
            transition: all 0.3s ease;
            outline: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: clamp(0.6em, 1.5vw, 0.75em);
            font-weight: 700;
            color: #c0c0c0;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.9);
            padding: 10px 6px;
            min-width: 0;
            word-break: break-word;
            text-align: center;
            background: linear-gradient(180deg, #0a0a0a 0%, #050505 50%, #000000 100%);
            box-shadow:
                0 7px 0 #000000,
                0 9px 18px rgba(0, 0, 0, 0.9);
            border: 2.5px solid #3a6bce;
            border-bottom: 2.5px solid #1e3d7a;
        }

        .botao-3d::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 50%;
            border-radius: 13px 13px 0 0;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.02) 0%, transparent 100%);
            pointer-events: none;
        }

        .botao-3d:active {
            transform: translateY(5px);
            box-shadow:
                0 2px 0 #000000,
                0 4px 10px rgba(0, 0, 0, 0.9);
            transition: all 0.06s ease;
        }

        /* Todos os botões com borda azul */
        .botao-3d {
            border-color: #3a6bce;
            border-bottom-color: #1e3d7a;
            box-shadow:
                0 7px 0 #0a1225,
                0 9px 18px rgba(0, 0, 0, 0.9),
                0 0 8px rgba(58, 107, 206, 0.15),
                0 0 2px rgba(58, 107, 206, 0.3);
        }

        /* Estado SELECIONADO - borda azul mais clara */
        .botao-3d.selecionado {
            background: linear-gradient(180deg, #0a0a0a 0%, #050505 50%, #000000 100%) !important;
            transform: translateY(4px) !important;
            border-color: #5bb8e8 !important;
            border-bottom-color: #2e7aa5 !important;
            box-shadow:
                0 3px 0 #0a1a25,
                0 5px 15px rgba(0, 0, 0, 0.9),
                0 0 12px rgba(91, 184, 232, 0.3),
                0 0 20px rgba(91, 184, 232, 0.2),
                0 0 6px rgba(91, 184, 232, 0.4) !important;
            animation: brilhoBordas 2s ease-in-out infinite alternate;
        }

        @keyframes brilhoBordas {
            0% {
                border-color: #5bb8e8;
                box-shadow:
                    0 3px 0 #0a1a25,
                    0 5px 15px rgba(0, 0, 0, 0.9),
                    0 0 10px rgba(91, 184, 232, 0.25),
                    0 0 18px rgba(91, 184, 232, 0.15),
                    0 0 5px rgba(91, 184, 232, 0.35);
            }
            100% {
                border-color: #88ccff;
                box-shadow:
                    0 3px 0 #0a1a25,
                    0 5px 15px rgba(0, 0, 0, 0.9),
                    0 0 15px rgba(91, 184, 232, 0.4),
                    0 0 25px rgba(91, 184, 232, 0.3),
                    0 0 8px rgba(91, 184, 232, 0.5);
            }
        }

        /* Ícones SVG personalizados - cores originais */
        .icone-svg {
            width: clamp(32px, 7vw, 42px);
            height: clamp(32px, 7vw, 42px);
            margin-bottom: 4px;
            filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.9));
            transition: all 0.3s ease;
        }

        .botao-3d:active .icone-svg {
            transform: scale(0.9);
            filter: drop-shadow(0 1px 2px rgba(0, 0, 0, 0.8));
        }

        /* Ícones laranja */
        .icone-laranja {
            stroke: #ffaa55;
            fill: #ff8c42;
            filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.9)) drop-shadow(0 0 3px rgba(255, 140, 66, 0.2));
        }

        /* Ícones verde */
        .icone-verde {
            stroke: #55dd88;
            fill: #2ecc71;
            filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.9)) drop-shadow(0 0 3px rgba(46, 204, 113, 0.2));
        }

        .selecionado .icone-laranja {
            stroke: #ffaa55;
            fill: #ff8c42;
            filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.9)) drop-shadow(0 0 6px rgba(255, 140, 66, 0.3));
        }

        .selecionado .icone-verde {
            stroke: #55dd88;
            fill: #2ecc71;
            filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.9)) drop-shadow(0 0 6px rgba(46, 204, 113, 0.3));
        }

        .botao-label {
            color: #555;
            font-size: clamp(0.55em, 1.3vw, 0.65em);
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            text-align: center;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.9);
            line-height: 1.1;
            margin-top: 3px;
        }

        .led-indicator {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #050505;
            box-shadow: 0 0 5px rgba(0, 0, 0, 0.95);
            flex-shrink: 0;
            transition: all 0.5s ease;
        }

        .led-active {
            background: #5bb8e8;
            box-shadow: 0 0 6px #5bb8e8, 0 0 12px #5bb8e8, 0 0 18px rgba(91, 184, 232, 0.3);
            animation: ledGlow 2s ease-in-out infinite alternate;
        }

        @keyframes ledGlow {
            0% {
                box-shadow: 0 0 5px #5bb8e8, 0 0 10px #5bb8e8;
            }
            100% {
                box-shadow: 0 0 8px #5bb8e8, 0 0 15px #5bb8e8, 0 0 22px rgba(91, 184, 232, 0.3);
            }
        }

        .painel-footer {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px 0;
            border-top: 1px solid #0a0a0a;
            flex-shrink: 0;
            margin-top: 10px;
        }

        .btn-reset {
            background: #050505;
            border: 2px solid #3a6bce;
            color: #555;
            padding: 10px 30px;
            border-radius: 22px;
            cursor: pointer;
            font-size: clamp(0.7em, 1.5vw, 0.8em);
            font-weight: 700;
            letter-spacing: 2px;
            transition: all 0.3s;
            text-transform: uppercase;
            box-shadow: 0 5px 0 #000000, 0 0 8px rgba(58, 107, 206, 0.1);
            border-bottom-color: #1e3d7a;
        }

        .btn-reset:hover {
            border-color: #5bb8e8;
            box-shadow: 0 5px 0 #000000, 0 0 15px rgba(91, 184, 232, 0.2);
            color: #88ccff;
        }

        .btn-reset:active {
            background: #0a0a0a;
            color: #88ccff;
            transform: translateY(3px);
            box-shadow: 0 2px 0 #000000, 0 0 12px rgba(91, 184, 232, 0.3);
            border-color: #5bb8e8;
        }

        @media (max-width: 600px) and (orientation: landscape) {
            .grid-botoes {
                grid-template-columns: repeat(6, 1fr);
                gap: 7px;
            }
            .botao-3d {
                border-radius: 12px;
                font-size: 0.55em;
                aspect-ratio: 1 / 0.9;
            }
            .icone-svg {
                width: clamp(26px, 5.5vw, 32px);
                height: clamp(26px, 5.5vw, 32px);
            }
            .botao-label {
                font-size: 0.5em;
            }
            .painel-fullscreen {
                padding: 6px 10px;
            }
        }

        @media (min-width: 768px) and (orientation: landscape) {
            .grid-botoes {
                grid-template-columns: repeat(6, 1fr);
                gap: 16px;
                max-width: 850px;
                margin: 0 auto;
                width: 100%;
            }
            .botao-3d {
                border-radius: 18px;
            }
            .icone-svg {
                width: 46px;
                height: 46px;
            }
        }

        @media (min-width: 1024px) {
            .painel-fullscreen {
                justify-content: center;
            }
            .grid-botoes {
                max-width: 950px;
                gap: 20px;
            }
        }

        @media (orientation: portrait) {
            .grid-botoes {
                grid-template-columns: repeat(3, 1fr);
                gap: 14px;
            }
            .botao-3d {
                aspect-ratio: 1 / 1.05;
                font-size: 0.7em;
                border-radius: 14px;
            }
            .icone-svg {
                width: 38px;
                height: 38px;
            }
            .botao-label {
                font-size: 0.6em;
            }
        }
    </style>
</head>
<body>
    <div class="painel-fullscreen">
        <div class="painel-header">
            <h1></h1>
        </div>

        <div class="grid-botoes" id="gridBotoes">
            <!-- USB -->
            <div class="botao-wrapper">
                <button class="botao-3d" data-nome="USB" onclick="toggleBotao(this)">
                    <svg class="icone-svg icone-laranja" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 2L12 12"/>
                        <path d="M8 6L12 2L16 6"/>
                        <rect x="7" y="12" width="10" height="8" rx="2"/>
                        <path d="M10 16L14 16"/>
                    </svg>
                    <span>USB</span>
                </button>
                <div class="led-indicator" id="led-USB"></div>
            </div>

            <!-- WiFi -->
            <div class="botao-wrapper">
                <button class="botao-3d" data-nome="WiFi" onclick="toggleBotao(this)">
                    <svg class="icone-svg icone-verde" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M5 12.55a11 11 0 0 1 14.08 0"/>
                        <path d="M1.42 9a16 16 0 0 1 21.16 0"/>
                        <path d="M8.53 16.11a6 6 0 0 1 6.95 0"/>
                        <circle cx="12" cy="20" r="1"/>
                    </svg>
                    <span>WiFi</span>
                </button>
                <div class="led-indicator" id="led-WiFi"></div>
            </div>

            <!-- Leitura -->
            <div class="botao-wrapper">
                <button class="botao-3d" data-nome="Leitura" onclick="toggleBotao(this)">
                    <svg class="icone-svg icone-laranja" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/>
                        <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>
                        <line x1="12" y1="8" x2="12" y2="12"/>
                    </svg>
                    <span>Leitura</span>
                </button>
                <div class="led-indicator" id="led-Leitura"></div>
            </div>

            <!-- Poltronas -->
            <div class="botao-wrapper">
                <button class="botao-3d" data-nome="Poltronas" onclick="toggleBotao(this)">
                    <svg class="icone-svg icone-verde" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="4" y="6" width="16" height="12" rx="2"/>
                        <path d="M7 6V4a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v2"/>
                        <path d="M7 18v2a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2v-2"/>
                        <line x1="8" y1="10" x2="16" y2="10"/>
                    </svg>
                    <span>Poltronas</span>
                </button>
                <div class="led-indicator" id="led-Poltronas"></div>
            </div>

            <!-- Corredor -->
            <div class="botao-wrapper">
                <button class="botao-3d" data-nome="Corredor" onclick="toggleBotao(this)">
                    <svg class="icone-svg icone-laranja" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="3" y1="12" x2="21" y2="12"/>
                        <line x1="3" y1="6" x2="21" y2="6"/>
                        <line x1="3" y1="18" x2="21" y2="18"/>
                        <polygon points="15 12 21 8 21 16 15 12"/>
                    </svg>
                    <span>Corredor</span>
                </button>
                <div class="led-indicator" id="led-Corredor"></div>
            </div>

            <!-- Salão -->
            <div class="botao-wrapper">
                <button class="botao-3d" data-nome="Salão" onclick="toggleBotao(this)">
                    <svg class="icone-svg icone-verde" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="2" y="3" width="20" height="18" rx="2"/>
                        <line x1="2" y1="9" x2="22" y2="9"/>
                        <circle cx="12" cy="15" r="2"/>
                        <path d="M8 15L8 15.01"/>
                        <path d="M16 15L16 15.01"/>
                    </svg>
                    <span>Salão</span>
                </button>
                <div class="led-indicator" id="led-Salão"></div>
            </div>

            <!-- Luz Noturna -->
            <div class="botao-wrapper">
                <button class="botao-3d" data-nome="Luz Noturna" onclick="toggleBotao(this)">
                    <svg class="icone-svg icone-laranja" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
                        <circle cx="12" cy="12" r="3"/>
                        <line x1="12" y1="2" x2="12" y2="5"/>
                        <line x1="12" y1="19" x2="12" y2="22"/>
                        <line x1="4.93" y1="4.93" x2="7.05" y2="7.05"/>
                        <line x1="16.95" y1="16.95" x2="19.07" y2="19.07"/>
                    </svg>
                    <span>Luz Not.</span>
                </button>
                <div class="led-indicator" id="led-Luz Noturna"></div>
            </div>

            <!-- Banheiro -->
            <div class="botao-wrapper">
                <button class="botao-3d" data-nome="Banheiro" onclick="toggleBotao(this)">
                    <svg class="icone-svg icone-verde" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="5" r="2"/>
                        <path d="M10 22v-5l-2-7h8l-2 7v5"/>
                        <path d="M8 10h8"/>
                        <rect x="4" y="12" width="16" height="8" rx="1"/>
                    </svg>
                    <span>Banheiro</span>
                </button>
                <div class="led-indicator" id="led-Banheiro"></div>
            </div>

            <!-- Ventilação 1 -->
            <div class="botao-wrapper">
                <button class="botao-3d" data-nome="Ventilação 1" onclick="toggleBotao(this)">
                    <svg class="icone-svg icone-laranja" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="10"/>
                        <path d="M12 2a10 10 0 0 1 10 10"/>
                        <path d="M12 2a10 10 0 0 0-10 10"/>
                        <line x1="2" y1="12" x2="22" y2="12"/>
                        <path d="M12 2a15 15 0 0 1 4 10 15 15 0 0 1-4 10"/>
                        <path d="M12 2a15 15 0 0 0-4 10 15 15 0 0 0 4 10"/>
                    </svg>
                    <span>Vent. 1</span>
                </button>
                <div class="led-indicator" id="led-Ventilação 1"></div>
            </div>

            <!-- Ventilação 2 -->
            <div class="botao-wrapper">
                <button class="botao-3d" data-nome="Ventilação 2" onclick="toggleBotao(this)">
                    <svg class="icone-svg icone-verde" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="10"/>
                        <path d="M12 2a10 10 0 0 1 10 10"/>
                        <path d="M12 2a10 10 0 0 0-10 10"/>
                        <line x1="2" y1="12" x2="22" y2="12"/>
                        <path d="M12 2a15 15 0 0 1 4 10 15 15 0 0 1-4 10"/>
                        <path d="M12 2a15 15 0 0 0-4 10 15 15 0 0 0 4 10"/>
                    </svg>
                    <span>Vent. 2</span>
                </button>
                <div class="led-indicator" id="led-Ventilação 2"></div>
            </div>

            <!-- Geladeira -->
            <div class="botao-wrapper">
                <button class="botao-3d" data-nome="Geladeira" onclick="toggleBotao(this)">
                    <svg class="icone-svg icone-laranja" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="4" y="2" width="16" height="20" rx="2"/>
                        <line x1="4" y1="10" x2="20" y2="10"/>
                        <rect x="8" y="4" width="8" height="4" rx="1"/>
                        <line x1="8" y1="14" x2="16" y2="14"/>
                    </svg>
                    <span>Geladeira</span>
                </button>
                <div class="led-indicator" id="led-Geladeira"></div>
            </div>
        </div>

        <div class="painel-footer">
            <button class="btn-reset" onclick="resetTodos()">RESET</button>
        </div>
    </div>

    <script>
        const estadoBotoes = {};

        function toggleBotao(botao) {
            const nome = botao.getAttribute('data-nome');
            const led = document.getElementById('led-' + nome);

            if (!estadoBotoes[nome]) {
                estadoBotoes[nome] = true;
                botao.classList.add('selecionado');
                if (led) {
                    led.classList.add('led-active');
                }

                if (window.navigator && window.navigator.vibrate) {
                    window.navigator.vibrate(20);
                }

                console.log(`✅ Botão ${nome}: LIGADO`);
            } else {
                estadoBotoes[nome] = false;
                botao.classList.remove('selecionado');
                if (led) {
                    led.classList.remove('led-active');
                }

                if (window.navigator && window.navigator.vibrate) {
                    window.navigator.vibrate(15);
                }

                console.log(`❌ Botão ${nome}: DESLIGADO`);
            }
        }

        function resetTodos() {
            const botoes = document.querySelectorAll('.botao-3d');
            botoes.forEach(botao => {
                const nome = botao.getAttribute('data-nome');
                estadoBotoes[nome] = false;
                botao.classList.remove('selecionado');
                const led = document.getElementById('led-' + nome);
                if (led) {
                    led.classList.remove('led-active');
                }
            });

            if (window.navigator && window.navigator.vibrate) {
                window.navigator.vibrate(40);
            }
            console.log('🔄 Todos os botões resetados');
        }

        document.addEventListener('DOMContentLoaded', () => {
            const botoes = document.querySelectorAll('.botao-3d');
            botoes.forEach(botao => {
                const nome = botao.getAttribute('data-nome');
                estadoBotoes[nome] = false;
            });

            document.addEventListener('gesturestart', function(e) {
                e.preventDefault();
            });
            document.addEventListener('gesturechange', function(e) {
                e.preventDefault();
            });
            document.addEventListener('gestureend', function(e) {
                e.preventDefault();
            });

            document.querySelectorAll('.botao-3d').forEach(botao => {
                botao.addEventListener('touchstart', function(e) {
                    e.stopPropagation();
                }, { passive: false });
                botao.addEventListener('touchmove', function(e) {
                    e.preventDefault();
                }, { passive: false });
            });
        });
    </script>
</body>
</html>
